name: Build and Publish minibox Container Images

on:
  push:
    branches:
      - main
    paths:
      - 'Containerfile.*'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/debian-box

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: normal
            file: Containerfile.normal
            tags: |
              latest
              normal
          - preset: wine
            file: Containerfile.wine
            tags: |
              wine
          - preset: ai
            file: Containerfile.ai
            tags: |
              ai

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Format Docker Tags
        id: tags
        run: |
          TAG_FLAGS=""
          for tag in ${{ matrix.tags }}; do
            TAG_FLAGS="${TAG_FLAGS} -t ${{ env.IMAGE_BASE }}:${tag}"
          done
          echo "tag_flags=${TAG_FLAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Image
        run: |
          docker buildx build \
            --file ${{ matrix.file }} \
            ${{ steps.tags.outputs.tag_flags }} \
            --push \
            .
