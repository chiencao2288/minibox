name: Build and Publish minibox Container Images

on:
  push:
    branches:
      - main
    paths:
      - 'Containerfile.*'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: normal
            file: Containerfile.normal
            tags: |
              ghcr.io/chiencao2288/debian-box:latest
              ghcr.io/chiencao2288/debian-box:normal
          - preset: wine
            file: Containerfile.wine
            tags: |
              ghcr.io/chiencao2288/debian-box:wine
          - preset: ai
            file: Containerfile.ai
            tags: |
              ghcr.io/chiencao2288/debian-box:ai

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ matrix.tags }}
